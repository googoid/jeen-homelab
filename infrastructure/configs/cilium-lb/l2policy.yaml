---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: jeen-l2
spec:
  # Announce LoadBalancer IPs only (not node external IPs). Restrict ARP replies
  # to the single host-only NIC. Cilium keys on the primary kernel name
  # (enp0s3); "eth0" is only a Talos altname, so match both prefixes.
  loadBalancerIPs: true
  interfaces:
    - "^(eth|enp)[0-9].*"
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
