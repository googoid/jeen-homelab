# The Ceph cluster itself: a CephCluster consuming the two raw disks (sdb/sdc) on
# each of the 3 workers (6 OSDs, replica 3), plus an RBD block pool + StorageClass
# (cluster default) and a CephFS filesystem + StorageClass (RWX). Depends on the
# rook-ceph-operator release (CRDs + operator) — also gated at the Flux
# Kustomization level (infra-configs dependsOn infra-controllers).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  releaseName: rook-ceph-cluster
  interval: 30m
  dependsOn:
    - name: rook-ceph-operator
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "v1.20.0"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operatorNamespace: rook-ceph
    toolbox:
      enabled: true
    monitoring:
      enabled: false

    cephClusterSpec:
      mon:
        count: 3
        allowMultiplePerNode: false
      mgr:
        count: 2
        modules:
          - name: rook
            enabled: true
      dashboard:
        enabled: true
        ssl: false
      # Consume only the two raw disks on each worker; never touch the OS disk.
      storage:
        useAllNodes: false
        useAllDevices: false
        nodes:
          - name: wk-01
            devices:
              - name: sdb
              - name: sdc
          - name: wk-02
            devices:
              - name: sdb
              - name: sdc
          - name: wk-03
            devices:
              - name: sdb
              - name: sdc
      # Keep all Ceph daemons off the (tainted, tiny) control planes.
      placement:
        all:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      # Conservative requests for 8 GB workers.
      resources:
        mgr:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        mon:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { memory: 512Mi }
        osd:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { memory: 2Gi }

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/fstype: ext4

    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            resources:
              requests: { cpu: 100m, memory: 256Mi }
              limits: { memory: 512Mi }
        storageClass:
          enabled: true
          name: ceph-filesystem
          isDefault: false
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          pool: data0

    cephObjectStores: []
