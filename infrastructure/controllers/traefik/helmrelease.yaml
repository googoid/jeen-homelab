# Traefik ingress controller. Exposed via a Cilium LoadBalancer Service pinned to
# 10.66.6.200 (pool/policy in infrastructure/configs/cilium-lb). The dashboard is
# served through the chart's built-in IngressRoute at http://traefik.jeen.local
# (point /etc/hosts at the LB IP). Internal network only — no auth yet.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "40.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    service:
      type: LoadBalancer
      annotations:
        # Cilium LB-IPAM: pin a stable VIP from the pool.
        lbipam.cilium.io/ips: "10.66.6.200"
    ports:
      web:
        port: 80
      websecure:
        port: 443
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: "Host(`traefik.jeen.local`)"
        entryPoints:
          - web
