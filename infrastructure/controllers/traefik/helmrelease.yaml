# Traefik ingress controller. Exposed via a Cilium LoadBalancer Service pinned to
# 10.66.6.200 (pool/policy in infrastructure/configs/cilium-lb). Dashboard route
# lives with the others in infrastructure/configs/dashboard-routes. Internal
# network only — no auth yet.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  releaseName: traefik
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "40.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    service:
      type: LoadBalancer
      annotations:
        # Cilium LB-IPAM: pin a stable VIP from the pool.
        lbipam.cilium.io/ips: "10.66.6.200"
    ports:
      web:
        port: 80
      websecure:
        port: 443
    ingressRoute:
      # The dashboard IngressRoute is defined alongside the others in
      # infrastructure/configs/dashboard-routes (routes to api@internal). The
      # dashboard/API itself stays enabled (chart default api.dashboard=true).
      dashboard:
        enabled: false
