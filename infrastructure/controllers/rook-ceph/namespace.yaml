---
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    # Rook runs privileged pods (OSDs, mon, csi); Talos enforces Pod Security
    # Admission, so the namespace must be allowed to run privileged workloads.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
