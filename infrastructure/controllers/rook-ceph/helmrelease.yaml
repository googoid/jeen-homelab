# Rook-Ceph operator. Installs the Ceph CRDs (CephCluster, CephBlockPool,
# CephFilesystem, …) and the operator that reconciles them. The actual cluster
# (CephCluster CR + pools + StorageClasses) is the rook-ceph-cluster release under
# infrastructure/configs, which dependsOn this.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  releaseName: rook-ceph
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      version: "v1.20.0"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: rook-ceph
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    monitoring:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
